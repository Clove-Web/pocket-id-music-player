<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Doughmination Music</title>

    <!-- Link unfurls (Discord, Twitter/X, iMessage, Slack…). Bots don't run
         JS, so these live in the static shell. theme-color is what Discord
         uses for the embed's coloured accent bar. -->
    <meta name="theme-color" content="#f5a9b8" />
    <meta name="description" content="Self-hosted music streaming — your library, your server." />

    <meta property="og:site_name" content="Doughmination Music" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Doughmination Music" />
    <meta property="og:description" content="Self-hosted music streaming — your library, your server." />
    <meta property="og:url" content="https://doughmination.me/" />
    <meta property="og:image" content="https://doughmination.me/favicon.png" />
    <meta property="og:image:width" content="640" />
    <meta property="og:image:height" content="640" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Doughmination Music" />
    <meta name="twitter:description" content="Self-hosted music streaming — your library, your server." />
    <meta name="twitter:image" content="https://doughmination.me/favicon.png" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.doughmination.co.uk" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
