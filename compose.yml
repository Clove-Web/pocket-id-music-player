services:
  music:
    user: 1000:1002
    image: doughmination/doughmination-music:latest
    container_name: music
    ports:
      - "127.0.0.1:4060:4060"
    volumes:
      - "./.env:/app/.env:ro"
      - "./.env.keys:/app/.env.keys:ro"
      - "./data:/app/data"
    networks:
      - infra
    restart: unless-stopped

networks:
  infra:
    external: true