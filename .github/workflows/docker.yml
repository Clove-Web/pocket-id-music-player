name: docker

# Builds the server image (root Dockerfile) and pushes it to Docker Hub.
#   - push to main        -> tags `latest` and `main-<short-sha>`
#   - push a v* git tag   -> semver tags, e.g. `1.2.3` and `1.2`
#   - manual run          -> same as a main push
#
# Requires two repo secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker
# Hub *access token*, not your password — Account Settings > Security).
on:
  workflow_dispatch:

env:
  # The Docker Hub repository name (the part after your username). Change this
  # if you want the image published under a different name.
  IMAGE_NAME: doughmination-music

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Derives the image name + the set of tags to push from the event that
      # triggered the run (branch push vs version tag).
      - name: derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          # amd64 covers most self-hosted servers. To also publish arm64 (e.g.
          # for a Pi / ARM VPS), add `linux/arm64` here and a
          # `docker/setup-qemu-action@v3` step above — note the arm64 leg builds
          # under emulation, so it's noticeably slower.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse layers between runs via the GitHub Actions cache.
          cache-from: type=gha
          cache-to: type=gha,mode=max
