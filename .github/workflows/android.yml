name: android

# Builds and publishes the SIGNED native Android APK (apps/android) on its own,
# independently of the Tauri desktop `release` workflow. This is the real
# music-player APK: a WebView shell around the site plus a native Media3
# playback service (background/locked playback + a media notification), which
# the Tauri build could not provide.
#
# Reuses the SAME repo secrets the Tauri android job uses:
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, ANDROID_KEY_BASE64
#
# Trigger manually from the Actions tab and give it a tag (e.g. android-v1.0.0).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. android-v1.0.0"
        required: true
        type: string
      siteUrl:
        description: "Override the site the WebView loads (optional)"
        required: false
        type: string

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + upload the APK

    steps:
      - uses: actions/checkout@v7

      # Gradle + AGP need JDK 17.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Provides sdkmanager and accepts the SDK licenses.
      - uses: android-actions/setup-android@v3

      # Make sure the exact platform + build-tools the module targets are present.
      - name: install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Write keystore.properties + decode the keystore from repo secrets so the
      # release build signs automatically (same pattern as patch-android-signing).
      - name: set up signing
        working-directory: apps/android
        run: |
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > "$RUNNER_TEMP/keystore.jks"
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      - name: build signed APK
        working-directory: apps/android
        run: |
          ARGS="-PversionName=${VERSION#*v} -PversionCode=${{ github.run_number }}"
          if [ -n "${SITE_URL}" ]; then ARGS="$ARGS -PsiteUrl=${SITE_URL}"; fi
          gradle assembleRelease --no-daemon $ARGS
        env:
          VERSION: ${{ inputs.version }}
          SITE_URL: ${{ inputs.siteUrl }}

      # Fail loudly if only an unsigned APK exists (signing silently didn't apply).
      - name: locate signed APK
        id: apk
        working-directory: apps/android
        run: |
          APK=$(find app/build/outputs/apk/release -name "*-release.apk" ! -name "*unsigned*" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No signed release APK found — did the ANDROID_KEY_* secrets apply?"
            find app/build/outputs/apk -name "*.apk" || true
            exit 1
          fi
          OUT="doughmination-music-${{ inputs.version }}-android.apk"
          cp "$APK" "$OUT"
          echo "path=apps/android/$OUT" >> "$GITHUB_OUTPUT"

      # Always attach the APK to the run so it's downloadable even without a release.
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: ${{ steps.apk.outputs.path }}

      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.version }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Doughmination Music (Android) $TAG" \
              --notes "Native Android APK with background playback + media notification."
          gh release upload "$TAG" "${{ steps.apk.outputs.path }}" --clobber
