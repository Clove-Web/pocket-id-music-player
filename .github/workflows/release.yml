name: release

# Builds every platform for one tag and publishes a single GitHub Release:
# desktop (macOS/Linux/Windows via tauri-action) plus the signed native
# Android APK (apps/android — a WebView shell around the site with a native
# Media3 playback service for background/locked playback; NOT built via the
# Tauri Android target). The desktop job creates the release as a *draft*;
# the android job attaches the APK last and then flips it to published +
# "latest", so the release only goes live once all artifacts are present.
#
# Used to be two workflows (this one covered desktop + a Tauri-built Android
# APK; a separate android.yml covered the real apps/android APK under its own
# "android-vX" tag). Merged into this single file/tag/release on 2026-08-22 —
# the Tauri Android target never shipped background playback, so it was
# always the wrong artifact to publish.
#
# THIS FILE IS MADE BY CLAUDE, SO IF SHIT BREAKS, I'M SORRY!
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. v1.0.0"
        required: true
        type: string
      siteUrl:
        description: "Override the site the Android WebView loads (optional)"
        required: false
        type: string

jobs:
  build:
    # tauri-action creates/updates a GitHub Release, which needs write access.
    # The default GITHUB_TOKEN is read-only ("Resource not accessible by
    # integration"), so grant it explicitly.
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          # Pinned to 22.04 (not ubuntu-latest/24.04): builds an AppImage
          # against an older glibc/webkit so it runs on more distros, and
          # keeps libappindicator3-dev available.
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      # The Discord SDK binaries used to be committed via Git LFS — 745MB of
      # debug/iOS/Android builds this project never uses, re-fetched in full
      # by all 3 matrix jobs on every run, which blew through GitHub's free
      # LFS bandwidth budget and blocked every release build. Now a lean
      # (~17MB), release-only, all-desktop-platforms re-host lives on our own
      # CDN instead — not subject to that quota. See .gitignore for why the
      # directory isn't tracked, and build.rs for how it's consumed once
      # unpacked here.
      - name: fetch Discord Social SDK
        shell: bash
        run: |
          curl -sSL -o discord-sdk.zip "https://m.doughmination.gay/sdks/discord-sdk.zip"
          unzip -q discord-sdk.zip -d apps/desktop/src-tauri
          rm discord-sdk.zip

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install Linux tauri deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # libfuse2: lets the AppImage tooling (linuxdeploy) run at all.
          # gstreamer*: Tauri's AppImage build runs linuxdeploy-plugin-gstreamer
          #   (webkit2gtk uses gstreamer for HTML5 <audio>); without gstreamer
          #   installed that plugin errors and linuxdeploy fails.
          # gstreamer *runtime* packages only — the -dev variants pull in
          # libunwind-dev, which conflicts with the runner's preinstalled
          # packages ("held broken packages"). The AppImage gstreamer plugin
          # only needs the runtime libs/plugins present, not headers.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-libav

      - run: bun install

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Run the AppImage tools in extract-and-run mode so they don't need
          # FUSE (unavailable on GitHub runners) — the other half of the
          # "failed to run linuxdeploy" fix.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # Help linuxdeploy resolve the Discord SDK shared object when bundling
          # the AppImage (backs up the $ORIGIN rpath in build.rs). Linux-only
          # var; harmless on the macOS/Windows runners.
          LD_LIBRARY_PATH: ${{ github.workspace }}/apps/desktop/src-tauri/discord_social_sdk/lib/release
        with:
          projectPath: apps/desktop/src-tauri
          # Manual runs supply the tag via the `version` input; tag pushes use
          # the pushed tag name. tauri-action creates the tag + draft release.
          tagName: ${{ inputs.version || github.ref_name }}
          releaseName: "Doughmination Music ${{ inputs.version || github.ref_name }}"
          # Kept as a draft here on purpose — the android job publishes it as
          # "latest" once the signed APK is uploaded (see the android job).
          releaseDraft: true
          prerelease: false
          # --verbose surfaces the underlying linuxdeploy/bundler output so a
          # failure shows the real error instead of just "failed to run …".
          args: ${{ matrix.args }} --verbose

      # Force the AppImage onto the host's GTK/WebKitGTK stack.
      #
      # Rationale (why we don't bundle WebKitGTK): a bundled WebKitGTK build
      # has been confirmed to hard-crash at startup — "Could not create
      # default EGL display: EGL_BAD_PARAMETER", before it ever touches a GPU
      # — on at least one real Wayland compositor + modern Mesa combination
      # where the SAME machine's system-installed WebKitGTK works fine.
      # GPU/Wayland-coupled libraries are fragile to bundle across distros,
      # which is exactly why every other WebKitGTK-based Linux package
      # (.deb/.rpm) declares it as a runtime dependency instead of shipping
      # its own copy. This app does the same — see ReadMe.md's "Linux runtime
      # requirement".
      #
      # Why we strip the WHOLE stack and not just libwebkit2gtk: these
      # libraries are one tightly version-coupled graph, so removing part of
      # it and keeping the rest is *worse* than either extreme — the host
      # loads its own copy of what we deleted, which then fails to resolve
      # symbols against the Ubuntu 22.04 copies we kept. Deleting only
      # libwebkit2gtk-4.1.so.0 (what this step used to do) shipped an
      # AppImage that died instantly on Arch with:
      #   symbol lookup error: /usr/lib/libwebkit2gtk-4.1.so.0:
      #     undefined symbol: _ZN3WTF20base64EncodeToString...
      # because host libwebkit2gtk was paired with the bundled (older)
      # libjavascriptcoregtk. Clearing that one exposed the next link in the
      # same chain, and so on: javascriptcoregtk -> gstreamer
      # (gst_debug_log_id) -> glib (g_once_init_leave_pointer) -> libmount
      # (MOUNT_2_40) -> ... It bottoms out only when the host provides the
      # entire graph, so that's what we do: drop every bundled library except
      # the app's own private one (the Discord SDK, which no distro ships).
      #
      # The linuxdeploy GTK hook is rewritten to match. Its stock version
      # points GTK_PATH / GDK_PIXBUF_MODULE_FILE / GIO_EXTRA_MODULES /
      # GTK_IM_MODULE_FILE / GSETTINGS_SCHEMA_DIR at module caches inside the
      # AppDir that no longer exist — and that host GTK must not load anyway.
      # GDK_BACKEND=x11 is kept from the stock hook (native Wayland crashes:
      # tauri-apps/tauri#8541).
      #
      # Everything the host must now provide (gtk3, glib, libsoup3,
      # gstreamer) is a hard dependency of webkit2gtk-4.1, so requiring that
      # one package is still the whole ask.
      #
      # Re-uploads over what tauri-action just attached to the draft release.
      - name: unbundle the GTK/WebKitGTK stack from the AppImage
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          # (no `pipefail`: `find | head -1` below can hand find an EPIPE.)
          set -eu

          APPIMAGE=$(find apps/desktop/src-tauri/target -maxdepth 5 -name "*.AppImage" | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "::error::No .AppImage found to patch"
            exit 1
          fi

          DIR=$(cd "$(dirname "$APPIMAGE")" && pwd)
          NAME=$(basename "$APPIMAGE")
          cd "$DIR"
          chmod +x "$NAME"
          ./"$NAME" --appimage-extract >/dev/null

          # Private, non-distro libraries that must survive the purge.
          KEEP='libdiscord_partner_sdk.so'

          echo "Bundled libraries before: $(find squashfs-root/usr/lib -type f -name '*.so*' | wc -l)"
          find squashfs-root/usr/lib -mindepth 1 -maxdepth 1 \
            ! -name "$KEEP" -exec rm -rf {} +
          echo "Bundled libraries after:  $(find squashfs-root/usr/lib -type f -name '*.so*' | wc -l)"

          # linuxdeploy also drags in the Ubuntu packages' /usr/share/doc and a
          # copy of their GLib schemas. The docs are dead weight, and the
          # schemas would shadow the host's (XDG_DATA_DIRS puts the AppDir
          # first) with a 22.04-era set. Neither belongs here now.
          rm -rf squashfs-root/usr/share/doc squashfs-root/usr/share/glib-2.0

          # Fail loudly rather than shipping an AppImage missing its own lib.
          if [ ! -f "squashfs-root/usr/lib/$KEEP" ]; then
            echo "::error::$KEEP was removed — the app will not start"
            exit 1
          fi

          # Two fixes to Tauri's generated .desktop entry, which the AUR
          # package (packaging/aur/PKGBUILD) also installs verbatim:
          #   - Exec had no %u, so the doughmination:// sign-in callback was
          #     never passed to the app despite the MimeType line claiming
          #     the scheme.
          #   - Categories was emitted empty, which is invalid and leaves the
          #     app uncategorised in menus.
          for d in squashfs-root/*.desktop \
                   squashfs-root/usr/share/applications/*.desktop; do
            [ -f "$d" ] || continue
            grep -q '%u' "$d" || sed -i 's|^\(Exec=.*\)$|\1 %u|' "$d"
            sed -i 's|^Categories=$|Categories=AudioVideo;Audio;Player;|' "$d"
          done

          cat > squashfs-root/apprun-hooks/linuxdeploy-plugin-gtk.sh <<'HOOK'
          #! /usr/bin/env bash
          # Rewritten by .github/workflows/release.yml — see the comment on the
          # "unbundle the GTK/WebKitGTK stack" step. GTK, GLib, GdkPixbuf, GIO
          # and WebKitGTK all come from the host, so none of the stock hook's
          # AppDir module/schema paths apply; setting them would make host GTK
          # load Ubuntu 22.04 modules.
          export APPDIR="${APPDIR:-"$(dirname "$(realpath "$0")")"}"
          export GDK_BACKEND=x11 # native Wayland crashes: tauri-apps/tauri#8541
          export XDG_DATA_DIRS="$APPDIR/usr/share:/usr/share:$XDG_DATA_DIRS"
          HOOK

          curl -sSL -o appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          # Same FUSE-less workaround as the tauri-action step above.
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool squashfs-root "$NAME"

          echo "Patched AppImage: $DIR/$NAME"
          gh release upload "$TAG" "$NAME" --clobber

  android:
    # Builds and publishes the SIGNED native Android APK (apps/android): a
    # WebView shell around the site plus a native Media3 playback service
    # (background/locked playback + a media notification) — NOT the Tauri
    # Android target, which can't provide that. Runs after the desktop matrix
    # so the draft release already exists to attach the APK to. If any desktop
    # build fails, this is skipped and the release stays a draft — we don't
    # publish a half-built release.
    needs: build
    runs-on: ubuntu-latest

    # Needs write access to upload the APK and flip the release to published.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # Gradle can't run on JDK 25 (the class-file-version error); 17 is the
      # Android reference JDK.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Provides sdkmanager and accepts the SDK licenses.
      - uses: android-actions/setup-android@v3

      # Make sure the exact platform + build-tools the module targets are present.
      - name: install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Write keystore.properties + decode the keystore from repo secrets so the
      # release build signs automatically.
      - name: set up signing
        working-directory: apps/android
        run: |
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > "$RUNNER_TEMP/keystore.jks"
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      - name: build signed APK
        working-directory: apps/android
        run: |
          ARGS="-PversionName=${VERSION#*v} -PversionCode=${{ github.run_number }}"
          if [ -n "${SITE_URL}" ]; then ARGS="$ARGS -PsiteUrl=${SITE_URL}"; fi
          gradle assembleRelease --no-daemon $ARGS
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          SITE_URL: ${{ inputs.siteUrl }}

      # Attach the signed APK to the draft release, then publish it as the
      # latest release. Fails loudly if only an -unsigned APK exists (which
      # would mean signing silently didn't apply).
      - name: upload APK and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          APK=$(find apps/android/app/build/outputs/apk/release \
            -name "*-release.apk" ! -name "*unsigned*" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No signed release APK found — did the ANDROID_KEY_* secrets apply?"
            find apps/android/app/build/outputs/apk -name "*.apk" || true
            exit 1
          fi
          echo "Signed APK: $APK"
          cp "$APK" "doughmination-music-$TAG-android.apk"
          gh release upload "$TAG" "doughmination-music-$TAG-android.apk" --clobber
          gh release edit "$TAG" --draft=false --latest

  aur:
    # Publishes the Arch package (doughmination-music) to the AUR from
    # packaging/aur/PKGBUILD.
    #
    # Runs after `android`, not after `build`, because `android` is the job
    # that flips the release from draft to published — and the PKGBUILD's
    # source= URL points at the release's public download endpoint, which
    # returns 404 for a draft. Nothing else here depends on Android.
    #
    # Skips itself (rather than failing) when AUR_SSH_PRIVATE_KEY isn't
    # configured, so forks and key-less runs still get a normal release.
    needs: android
    runs-on: ubuntu-latest
    # base-devel gives us makepkg + fakeroot; the alternative is reimplementing
    # .SRCINFO generation by hand on Ubuntu, which is exactly the sort of thing
    # that silently drifts from what the AUR expects.
    container: archlinux:base-devel

    steps:
      # Before checkout: actions/checkout falls back to a slow, shallow REST
      # download when git is missing from the container.
      - name: install tooling
        run: |
          pacman -Syu --noconfirm --needed \
            git openssh pacman-contrib namcap github-cli

      - uses: actions/checkout@v7

      - name: build and push the AUR package
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.version || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -eu

          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY is not set — skipping AUR publish"
            exit 0
          fi

          PKGVER="${TAG#v}"

          # tauri.conf.json's `version` — not the git tag — is what ends up in
          # the artifact filename, so ask the release what it's actually
          # called instead of reconstructing it and 404ing on a mismatch.
          APPIMAGE_NAME=$(gh release view "$TAG" --repo "$REPO" \
            --json assets --jq '.assets[].name | select(endswith(".AppImage"))' \
            | head -1)
          if [ -z "$APPIMAGE_NAME" ]; then
            echo "::error::No .AppImage asset on release $TAG"
            exit 1
          fi
          echo "Packaging $APPIMAGE_NAME as $PKGVER"

          # makepkg refuses to run as root, and this container is root.
          useradd -m builder
          WORK=/tmp/aurbuild
          install -d -o builder -g builder "$WORK"

          cp packaging/aur/PKGBUILD "$WORK/PKGBUILD"
          sed -i \
            -e "s|^pkgver=.*|pkgver=$PKGVER|" \
            -e "s|^pkgrel=.*|pkgrel=1|" \
            -e "s|^_appimagefile=.*|_appimagefile=\"$APPIMAGE_NAME\"|" \
            "$WORK/PKGBUILD"
          chown builder:builder "$WORK/PKGBUILD"

          # updpkgsums replaces the SKIP placeholders with real hashes of what
          # we just published; the test build is what catches a PKGBUILD that
          # no longer matches the artifact's layout BEFORE it reaches the AUR.
          runuser -l builder -c "cd $WORK && updpkgsums"
          runuser -l builder -c "cd $WORK && makepkg --printsrcinfo > .SRCINFO"
          runuser -l builder -c "cd $WORK && makepkg --nodeps --noconfirm"
          runuser -l builder -c "cd $WORK && namcap ./*.pkg.tar.zst" || \
            echo "::warning::namcap reported issues (advisory only)"

          PKGNAME=$(bash -c "source $WORK/PKGBUILD >/dev/null 2>&1; echo \$pkgname")

          install -dm700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519,rsa aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git config --global user.name "Doughmination Release Bot"
          git config --global user.email "clovetwilight3@outlook.com"

          # An AUR package is created by its first push — there is nothing to
          # register beforehand — so an empty/failed clone is the expected
          # path the very first time and must not abort the job.
          if ! git clone "ssh://aur@aur.archlinux.org/$PKGNAME.git" /tmp/aurrepo; then
            echo "::notice::No AUR repo yet for $PKGNAME — creating it with this push"
            git init -b master /tmp/aurrepo
            git -C /tmp/aurrepo remote add origin "ssh://aur@aur.archlinux.org/$PKGNAME.git"
          fi

          cp "$WORK/PKGBUILD" "$WORK/.SRCINFO" /tmp/aurrepo/
          git -C /tmp/aurrepo add PKGBUILD .SRCINFO
          if git -C /tmp/aurrepo diff --cached --quiet; then
            echo "::notice::AUR package already up to date for $PKGVER"
            exit 0
          fi
          git -C /tmp/aurrepo commit -m "Update to $PKGVER"
          git -C /tmp/aurrepo push origin HEAD:master
          echo "Published $PKGNAME $PKGVER to the AUR"
