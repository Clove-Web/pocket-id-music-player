name: release

# Builds every platform for one tag and publishes a single GitHub Release:
#
#   create-release  makes the draft
#   build           Electron desktop app for macOS / Linux / Windows via
#                   electron-builder (apps/desktop — a thin shell over the live
#                   site plus Discord Rich Presence over IPC; no Rust, no
#                   proprietary SDK)
#   android         the SIGNED native Android APK (apps/android — a WebView
#                   shell with a native Media3 playback service for
#                   background/locked playback), attached last, then the
#                   release is flipped to published + "latest"
#   aur             repackages the published Linux AppImage for the AUR
#
# The release only goes live once every artifact is present.
#
# Migrated off Tauri/Rust on 2026-08-30: gone are the Discord Social SDK fetch,
# the Rust toolchain, the Linux WebKitGTK build deps, and the whole "unbundle
# the GTK stack from the AppImage" dance — Electron ships its own Chromium.
#
# THIS FILE IS MADE BY CLAUDE, SO IF SHIT BREAKS, I'M SORRY!
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. v1.0.0"
        required: true
        type: string
      siteUrl:
        description: "Override the site the Android WebView loads (optional)"
        required: false
        type: string
      codename:
        description: 'Optional release codename, e.g. Aurora (title only)'
        required: false
        type: string

jobs:
  # Create the draft release up front so the matrix jobs (and android/aur) all
  # have something to attach to without racing each other on creation.
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: >-
            ${{ inputs.codename
            && format('Doughmination Music {0} "{1}"', inputs.version || github.ref_name, inputs.codename)
            || format('Doughmination Music {0}', inputs.version || github.ref_name) }}
          draft: true
          prerelease: false

  build:
    needs: create-release
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            electronArgs: "--universal"
          - platform: ubuntu-latest
            electronArgs: ""
          - platform: windows-latest
            electronArgs: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      # Compiles apps/desktop/src -> dist, then electron-builder packages it.
      # electron-builder reads apps/desktop/package.json `dependencies` to
      # bundle @xhayper/discord-rpc. Artifact names are pinned (version-less)
      # in apps/desktop/electron-builder.yml so no rename step is needed.
      - name: build desktop app
        working-directory: apps/desktop
        shell: bash
        run: bun run build:main && bunx electron-builder ${{ matrix.electronArgs }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: attach artifacts to the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          draft: true
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb

  android:
    # Builds and publishes the SIGNED native Android APK (apps/android): a
    # WebView shell around the site plus a native Media3 playback service
    # (background/locked playback + a media notification). Runs after the
    # desktop matrix so the draft release already exists to attach the APK to.
    # If any desktop build fails, this is skipped and the release stays a
    # draft — we don't publish a half-built release.
    needs: build
    runs-on: ubuntu-latest

    # Needs write access to upload the APK and flip the release to published.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # Gradle can't run on JDK 25 (the class-file-version error); 17 is the
      # Android reference JDK.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Provides sdkmanager and accepts the SDK licenses.
      - uses: android-actions/setup-android@v4

      # Make sure the exact platform + build-tools the module targets are present.
      - name: install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Write keystore.properties + decode the keystore from repo secrets so the
      # release build signs automatically.
      - name: set up signing
        working-directory: apps/android
        run: |
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > "$RUNNER_TEMP/keystore.jks"
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      - name: build signed APK
        working-directory: apps/android
        run: |
          ARGS="-PversionName=${VERSION#*v} -PversionCode=${{ github.run_number }}"
          if [ -n "${SITE_URL}" ]; then ARGS="$ARGS -PsiteUrl=${SITE_URL}"; fi
          gradle assembleRelease --no-daemon $ARGS
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          SITE_URL: ${{ inputs.siteUrl }}

      # Attach the signed APK to the draft release, then publish it as the
      # latest release. Fails loudly if only an -unsigned APK exists (which
      # would mean signing silently didn't apply).
      - name: upload APK and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          APK=$(find apps/android/app/build/outputs/apk/release \
            -name "*-release.apk" ! -name "*unsigned*" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No signed release APK found — did the ANDROID_KEY_* secrets apply?"
            find apps/android/app/build/outputs/apk -name "*.apk" || true
            exit 1
          fi
          echo "Signed APK: $APK"
          # Version-less, like the desktop artifacts — see the "republish
          # artifacts under version-less names" step in the build job.
          cp "$APK" "doughmination-music-android.apk"
          gh release upload "$TAG" "doughmination-music-android.apk" --clobber
          gh release edit "$TAG" --draft=false --latest

  aur:
    # Publishes the Arch package (doughmination-music) to the AUR from
    # packaging/aur/PKGBUILD.
    #
    # Runs after `android`, not after `build`, because `android` is the job
    # that flips the release from draft to published — and the PKGBUILD's
    # source= URL points at the release's public download endpoint, which
    # returns 404 for a draft. Nothing else here depends on Android.
    #
    # Skips itself (rather than failing) when AUR_SSH_PRIVATE_KEY isn't
    # configured, so forks and key-less runs still get a normal release.
    needs: android
    runs-on: ubuntu-latest
    # base-devel gives us makepkg + fakeroot; the alternative is reimplementing
    # .SRCINFO generation by hand on Ubuntu, which is exactly the sort of thing
    # that silently drifts from what the AUR expects.
    container: archlinux:base-devel

    steps:
      # Before checkout: actions/checkout falls back to a slow, shallow REST
      # download when git is missing from the container.
      - name: install tooling
        run: |
          pacman -Syu --noconfirm --needed \
            git openssh pacman-contrib namcap github-cli

      - uses: actions/checkout@v7

      - name: build and push the AUR package
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.version || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -eu

          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY is not set — skipping AUR publish"
            exit 0
          fi

          PKGVER="${TAG#v}"

          # The AppImage name is pinned version-less in
          # apps/desktop/electron-builder.yml, but ask the release what it's
          # actually called rather than hardcoding it here too.
          APPIMAGE_NAME=$(gh release view "$TAG" --repo "$REPO" \
            --json assets --jq '.assets[].name | select(endswith(".AppImage"))' \
            | head -1)
          if [ -z "$APPIMAGE_NAME" ]; then
            echo "::error::No .AppImage asset on release $TAG"
            exit 1
          fi
          echo "Packaging $APPIMAGE_NAME as $PKGVER"

          # makepkg refuses to run as root, and this container is root.
          useradd -m builder
          WORK=/tmp/aurbuild
          install -d -o builder -g builder "$WORK"

          cp packaging/aur/PKGBUILD "$WORK/PKGBUILD"
          sed -i \
            -e "s|^pkgver=.*|pkgver=$PKGVER|" \
            -e "s|^pkgrel=.*|pkgrel=1|" \
            -e "s|^_appimagefile=.*|_appimagefile=\"$APPIMAGE_NAME\"|" \
            "$WORK/PKGBUILD"
          chown builder:builder "$WORK/PKGBUILD"

          # updpkgsums replaces the SKIP placeholders with real hashes of what
          # we just published; the test build is what catches a PKGBUILD that
          # no longer matches the artifact's layout BEFORE it reaches the AUR.
          runuser -l builder -c "cd $WORK && updpkgsums"
          runuser -l builder -c "cd $WORK && makepkg --printsrcinfo > .SRCINFO"
          runuser -l builder -c "cd $WORK && makepkg --nodeps --noconfirm"
          runuser -l builder -c "cd $WORK && namcap ./*.pkg.tar.zst" || \
            echo "::warning::namcap reported issues (advisory only)"

          PKGNAME=$(bash -c "source $WORK/PKGBUILD >/dev/null 2>&1; echo \$pkgname")

          # Absolute paths, deliberately NOT ~/.ssh: this is a container job,
          # where Actions sets HOME=/github/home but OpenSSH resolves `~`
          # through getpwuid() to /root. The two disagree, so ssh-keyscan
          # wrote a known_hosts ssh never read and `-i ~/.ssh/aur` named a
          # file that did not exist — which surfaced, confusingly, as "Host
          # key verification failed" on the clone below.
          SSH_DIR=/tmp/aur-ssh
          install -dm700 "$SSH_DIR"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$SSH_DIR/id"
          chmod 600 "$SSH_DIR/id"

          # Pin the host key instead of trusting whatever keyscan happens to
          # meet; this is the fingerprint the AUR publishes.
          ssh-keyscan -t ed25519 aur.archlinux.org > "$SSH_DIR/known_hosts"
          _fp=$(ssh-keygen -lf "$SSH_DIR/known_hosts" | awk 'NR==1{print $2}')
          _expected='SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4'
          if [ "$_fp" != "$_expected" ]; then
            echo "::error::Unexpected host key for aur.archlinux.org: $_fp"
            exit 1
          fi

          _ssh="ssh -i $SSH_DIR/id -o IdentitiesOnly=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts"
          export GIT_SSH_COMMAND="$_ssh"
          git config --global user.name "Doughmination Release Bot"
          git config --global user.email "clovetwilight3@outlook.com"

          # Prove the key authenticates BEFORE reading anything into a clone
          # failure. Without this, a bad secret or unreachable host looks
          # exactly like "package doesn't exist yet" and gets quietly
          # promoted into a first-import attempt that then fails on push.
          if ! $_ssh aur@aur.archlinux.org help >/dev/null 2>&1; then
            echo "::error::Cannot authenticate to the AUR. Is AUR_SSH_PRIVATE_KEY the private half of the key registered on the AUR account?"
            exit 1
          fi

          # With auth proven, a failed clone means only that the package does
          # not exist yet — an AUR package is created by its first push, so
          # there is nothing to register beforehand.
          if ! git clone "ssh://aur@aur.archlinux.org/$PKGNAME.git" /tmp/aurrepo; then
            echo "::notice::No AUR repo yet for $PKGNAME — creating it with this push"
            git init -b master /tmp/aurrepo
            git -C /tmp/aurrepo remote add origin "ssh://aur@aur.archlinux.org/$PKGNAME.git"
          fi

          cp "$WORK/PKGBUILD" "$WORK/.SRCINFO" /tmp/aurrepo/
          git -C /tmp/aurrepo add PKGBUILD .SRCINFO
          if git -C /tmp/aurrepo diff --cached --quiet; then
            echo "::notice::AUR package already up to date for $PKGVER"
            exit 0
          fi
          git -C /tmp/aurrepo commit -m "Update to $PKGVER"
          git -C /tmp/aurrepo push origin HEAD:master
          echo "Published $PKGNAME $PKGVER to the AUR"
