name: release

# Builds every platform for one tag and publishes a single GitHub Release:
# desktop (macOS/Linux/Windows via tauri-action) plus a signed Android APK.
# The desktop job creates the release as a *draft*; the android job attaches
# the APK last and then flips it to published + "latest", so the release only
# goes live once all artifacts are present.
# 
# THIS FILE IS MADE BY CLAUDE, SO IF SHIT BREAKS, I'M SORRY!
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. v1.0.0"
        required: true
        type: string

jobs:
  build:
    # tauri-action creates/updates a GitHub Release, which needs write access.
    # The default GITHUB_TOKEN is read-only ("Resource not accessible by
    # integration"), so grant it explicitly.
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          # Pinned to 22.04 (not ubuntu-latest/24.04): builds an AppImage
          # against an older glibc/webkit so it runs on more distros, and
          # keeps libappindicator3-dev available.
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The Discord SDK binaries (*.dylib/*.so/*.aar/*.dbg) are tracked in
          # Git LFS. Without this the runner only gets pointer files and the
          # Tauri/cargo build fails to link libdiscord_partner_sdk.
          lfs: true

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install Linux tauri deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # libfuse2: lets the AppImage tooling (linuxdeploy) run at all.
          # gstreamer*: Tauri's AppImage build runs linuxdeploy-plugin-gstreamer
          #   (webkit2gtk uses gstreamer for HTML5 <audio>); without gstreamer
          #   installed that plugin errors and linuxdeploy fails.
          # gstreamer *runtime* packages only — the -dev variants pull in
          # libunwind-dev, which conflicts with the runner's preinstalled
          # packages ("held broken packages"). The AppImage gstreamer plugin
          # only needs the runtime libs/plugins present, not headers.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-libav

      - run: bun install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Run the AppImage tools in extract-and-run mode so they don't need
          # FUSE (unavailable on GitHub runners) — the other half of the
          # "failed to run linuxdeploy" fix.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # Help linuxdeploy resolve the Discord SDK shared object when bundling
          # the AppImage (backs up the $ORIGIN rpath in build.rs). Linux-only
          # var; harmless on the macOS/Windows runners.
          LD_LIBRARY_PATH: ${{ github.workspace }}/apps/desktop/src-tauri/discord_social_sdk/lib/release
        with:
          projectPath: apps/desktop/src-tauri
          # Manual runs supply the tag via the `version` input; tag pushes use
          # the pushed tag name. tauri-action creates the tag + draft release.
          tagName: ${{ inputs.version || github.ref_name }}
          releaseName: "Doughmination Music ${{ inputs.version || github.ref_name }}"
          # Kept as a draft here on purpose — the android job publishes it as
          # "latest" once the signed APK is uploaded (see the android job).
          releaseDraft: true
          prerelease: false
          # --verbose surfaces the underlying linuxdeploy/bundler output so a
          # failure shows the real error instead of just "failed to run …".
          args: ${{ matrix.args }} --verbose

  android:
    # Runs after the desktop matrix so the draft release already exists to
    # attach the APK to. If any desktop build fails, this is skipped and the
    # release stays a draft — we don't publish a half-built release.
    needs: build
    runs-on: ubuntu-latest

    # Needs write access to upload the APK and flip the release to published.
    permissions:
      contents: write

    steps:
      # No `lfs: true` here: the Android build gates the Discord SDK out
      # entirely (see Cargo.toml), so the LFS-tracked native libs aren't
      # needed — only the plain-text vendor manifests, which aren't in LFS.
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # Gradle can't run on JDK 25 (the class-file-version error); 17 is the
      # Android reference JDK. This sets JAVA_HOME for the Gradle invocation.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      # A universal APK compiles all four Android ABIs — cache the Rust build
      # so reruns aren't a cold 4-target compile.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # Pin the NDK rather than trust whatever the runner image ships.
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27
          add-to-path: false

      - run: bun install

      # gen/android is gitignored, so regenerate it on the runner. The Android
      # SDK is preinstalled on the runner (ANDROID_HOME is set); NDK_HOME comes
      # from the setup-ndk step above.
      - name: init Android project
        working-directory: apps/desktop/src-tauri
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        # Use the locally-installed CLI (bun run tauri) rather than `bunx`.
        # Tauri's generated Gradle project builds the Rust code per-ABI by
        # re-invoking the CLI as `bun run tauri …`, which needs a `tauri`
        # package.json script + @tauri-apps/cli as a dep. `bunx` leaves neither
        # in place, so that nested call fails with `Script not found "tauri"`.
        run: bun run tauri android init

      # `gen/android` is wiped and regenerated by `android init` above, which
      # ships Tauri's DEFAULT launcher icon. Our real icons live in the repo at
      # icons/android/ — re-apply them over the generated res/ dir (same reason
      # signing has to be re-patched below: nothing in gen/ is committed).
      - name: apply Android app icons
        working-directory: apps/desktop/src-tauri
        # `cp -r src/. dest/` merges contents into the existing res/ dirs
        # (overwriting the default icons) instead of nesting them.
        run: cp -r icons/android/. gen/android/app/src/main/res/

      # Inject the release signingConfig into the freshly generated
      # build.gradle.kts, then write keystore.properties + the decoded keystore
      # from repo secrets so the release build signs automatically.
      - name: set up signing
        working-directory: apps/desktop/src-tauri
        run: |
          bun scripts/patch-android-signing.ts
          cd gen/android
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > "$RUNNER_TEMP/keystore.jks"
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      - name: build signed APK
        working-directory: apps/desktop/src-tauri
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bun run tauri android build --apk

      # Attach the signed APK to the draft release, then publish it as the
      # latest release. Fails loudly if only an -unsigned APK exists (which
      # would mean signing silently didn't apply).
      - name: upload APK and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          APK=$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk \
            -name "*-release.apk" ! -name "*unsigned*" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No signed release APK found — did signing apply?"
            find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" || true
            exit 1
          fi
          echo "Signed APK: $APK"
          cp "$APK" "doughmination-music-$TAG-universal.apk"
          gh release upload "$TAG" "doughmination-music-$TAG-universal.apk" --clobber
          gh release edit "$TAG" --draft=false --latest
