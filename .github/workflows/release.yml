name: release

# Builds every platform for one tag and publishes a single GitHub Release:
# desktop (macOS/Linux/Windows via tauri-action) plus the signed native
# Android APK (apps/android — a WebView shell around the site with a native
# Media3 playback service for background/locked playback; NOT built via the
# Tauri Android target). The desktop job creates the release as a *draft*;
# the android job attaches the APK last and then flips it to published +
# "latest", so the release only goes live once all artifacts are present.
#
# Used to be two workflows (this one covered desktop + a Tauri-built Android
# APK; a separate android.yml covered the real apps/android APK under its own
# "android-vX" tag). Merged into this single file/tag/release on 2026-08-22 —
# the Tauri Android target never shipped background playback, so it was
# always the wrong artifact to publish.
#
# THIS FILE IS MADE BY CLAUDE, SO IF SHIT BREAKS, I'M SORRY!
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. v1.0.0"
        required: true
        type: string
      siteUrl:
        description: "Override the site the Android WebView loads (optional)"
        required: false
        type: string

jobs:
  build:
    # tauri-action creates/updates a GitHub Release, which needs write access.
    # The default GITHUB_TOKEN is read-only ("Resource not accessible by
    # integration"), so grant it explicitly.
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          # Pinned to 22.04 (not ubuntu-latest/24.04): builds an AppImage
          # against an older glibc/webkit so it runs on more distros, and
          # keeps libappindicator3-dev available.
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      # The Discord SDK binaries used to be committed via Git LFS — 745MB of
      # debug/iOS/Android builds this project never uses, re-fetched in full
      # by all 3 matrix jobs on every run, which blew through GitHub's free
      # LFS bandwidth budget and blocked every release build. Now a lean
      # (~17MB), release-only, all-desktop-platforms re-host lives on our own
      # CDN instead — not subject to that quota. See .gitignore for why the
      # directory isn't tracked, and build.rs for how it's consumed once
      # unpacked here.
      - name: fetch Discord Social SDK
        shell: bash
        run: |
          curl -sSL -o discord-sdk.zip "https://m.doughmination.gay/sdks/discord-sdk.zip"
          unzip -q discord-sdk.zip -d apps/desktop/src-tauri
          rm discord-sdk.zip

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install Linux tauri deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # libfuse2: lets the AppImage tooling (linuxdeploy) run at all.
          # gstreamer*: Tauri's AppImage build runs linuxdeploy-plugin-gstreamer
          #   (webkit2gtk uses gstreamer for HTML5 <audio>); without gstreamer
          #   installed that plugin errors and linuxdeploy fails.
          # gstreamer *runtime* packages only — the -dev variants pull in
          # libunwind-dev, which conflicts with the runner's preinstalled
          # packages ("held broken packages"). The AppImage gstreamer plugin
          # only needs the runtime libs/plugins present, not headers.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-libav

      - run: bun install

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Run the AppImage tools in extract-and-run mode so they don't need
          # FUSE (unavailable on GitHub runners) — the other half of the
          # "failed to run linuxdeploy" fix.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # Help linuxdeploy resolve the Discord SDK shared object when bundling
          # the AppImage (backs up the $ORIGIN rpath in build.rs). Linux-only
          # var; harmless on the macOS/Windows runners.
          LD_LIBRARY_PATH: ${{ github.workspace }}/apps/desktop/src-tauri/discord_social_sdk/lib/release
        with:
          projectPath: apps/desktop/src-tauri
          # Manual runs supply the tag via the `version` input; tag pushes use
          # the pushed tag name. tauri-action creates the tag + draft release.
          tagName: ${{ inputs.version || github.ref_name }}
          releaseName: "Doughmination Music ${{ inputs.version || github.ref_name }}"
          # Kept as a draft here on purpose — the android job publishes it as
          # "latest" once the signed APK is uploaded (see the android job).
          releaseDraft: true
          prerelease: false
          # --verbose surfaces the underlying linuxdeploy/bundler output so a
          # failure shows the real error instead of just "failed to run …".
          args: ${{ matrix.args }} --verbose

  android:
    # Builds and publishes the SIGNED native Android APK (apps/android): a
    # WebView shell around the site plus a native Media3 playback service
    # (background/locked playback + a media notification) — NOT the Tauri
    # Android target, which can't provide that. Runs after the desktop matrix
    # so the draft release already exists to attach the APK to. If any desktop
    # build fails, this is skipped and the release stays a draft — we don't
    # publish a half-built release.
    needs: build
    runs-on: ubuntu-latest

    # Needs write access to upload the APK and flip the release to published.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # Gradle can't run on JDK 25 (the class-file-version error); 17 is the
      # Android reference JDK.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Provides sdkmanager and accepts the SDK licenses.
      - uses: android-actions/setup-android@v3

      # Make sure the exact platform + build-tools the module targets are present.
      - name: install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Write keystore.properties + decode the keystore from repo secrets so the
      # release build signs automatically.
      - name: set up signing
        working-directory: apps/android
        run: |
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > "$RUNNER_TEMP/keystore.jks"
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      - name: build signed APK
        working-directory: apps/android
        run: |
          ARGS="-PversionName=${VERSION#*v} -PversionCode=${{ github.run_number }}"
          if [ -n "${SITE_URL}" ]; then ARGS="$ARGS -PsiteUrl=${SITE_URL}"; fi
          gradle assembleRelease --no-daemon $ARGS
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          SITE_URL: ${{ inputs.siteUrl }}

      # Attach the signed APK to the draft release, then publish it as the
      # latest release. Fails loudly if only an -unsigned APK exists (which
      # would mean signing silently didn't apply).
      - name: upload APK and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          APK=$(find apps/android/app/build/outputs/apk/release \
            -name "*-release.apk" ! -name "*unsigned*" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No signed release APK found — did the ANDROID_KEY_* secrets apply?"
            find apps/android/app/build/outputs/apk -name "*.apk" || true
            exit 1
          fi
          echo "Signed APK: $APK"
          cp "$APK" "doughmination-music-$TAG-android.apk"
          gh release upload "$TAG" "doughmination-music-$TAG-android.apk" --clobber
          gh release edit "$TAG" --draft=false --latest
